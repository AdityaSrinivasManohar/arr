---
# Internal `url:` values use container names on the compose network.
# qBittorrent shares gluetun's netns, so it answers as `gluetun`, not `qbittorrent`.
#
# `href:` is what your browser opens. Uses the MagicDNS FQDN, which works from
# anywhere *as long as Tailscale is connected* -- at home it still takes the
# direct LAN path, so there's no penalty for using it next to the machine.
# Without Tailscale on the client, fall back to http://arr.grayling-dory.ts.net:<port>.
# Bare short names (http://arr:<port>) do NOT resolve reliably from iOS.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://arr.grayling-dory.ts.net:8096
        description: Media server / streaming
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

    - Jellyseerr:
        icon: jellyseerr.png
        href: http://arr.grayling-dory.ts.net:5055
        description: Request front-end
        widget:
          type: jellyseerr
          url: http://jellyseerr:5055
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"

- Automation:
    - Radarr:
        icon: radarr.png
        href: http://arr.grayling-dory.ts.net:7878
        description: Movies
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          enableQueue: true

    - Sonarr:
        icon: sonarr.png
        href: http://arr.grayling-dory.ts.net:8989
        description: TV shows
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          enableQueue: true

    - Bazarr:
        icon: bazarr.png
        href: http://arr.grayling-dory.ts.net:6767
        description: Subtitles
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://arr.grayling-dory.ts.net:8080
        description: Torrent client (via gluetun)
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: "{{HOMEPAGE_VAR_QBIT_USER}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASS}}"

    - Prowlarr:
        icon: prowlarr.png
        href: http://arr.grayling-dory.ts.net:9696
        description: Indexer manager
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"

- Management:
    - Profilarr:
        icon: mdi-tune-variant
        href: http://arr.grayling-dory.ts.net:6868
        description: Quality profiles / custom formats

    - FlareSolverr:
        icon: mdi-cloud-lock-outline
        href: http://arr.grayling-dory.ts.net:8191
        description: Cloudflare bypass proxy

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: Remote access admin
