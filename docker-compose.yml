services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${NORDVPN_WG_ADDRESS}
      - WIREGUARD_ENDPOINT_IP=${NORDVPN_ENDPOINT_IP}
      - WIREGUARD_ENDPOINT_PORT=51820
      - WIREGUARD_PUBLIC_KEY=${NORDVPN_WG_PUBLIC_KEY}
      # Firewall killswitch: only allow LAN + tunnel traffic
      - FIREWALL_OUTBOUND_SUBNETS=10.0.0.0/24
      - TZ=${TZ}
    ports:
      # Reserved for qBittorrent's WebUI once it's added (network_mode: service:gluetun)
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - /data/config/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"   # <- all its traffic routes through gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /data/config/qbittorrent:/config
      - /data:/data          # single mount: hardlinks need one mount point, not two
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/sonarr:/config
      - /data:/data          # single mount: hardlinks need one mount point, not two
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/radarr:/config
      - /data:/data          # single mount: hardlinks need one mount point, not two
    ports:
      - 7878:7878
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/bazarr:/config
      - /data:/data          # must match the paths Sonarr/Radarr report
    ports:
      - 6767:6767
    restart: unless-stopped

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/jellyseerr:/app/config
    ports:
      - 5055:5055
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - 8191:8191
    restart: unless-stopped

  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    volumes:
      - /data/config/profilarr:/config
    ports:
      - 6868:6868
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /data/config/jellyfin:/config
      - /data:/media
    ports:
      - 8096:8096
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    # host networking puts tailscale0 in the host's stack, so every port
    # published by the services above is reachable over the tailnet.
    # (note: `hostname:` is not allowed alongside host networking — the
    #  node name comes from TS_HOSTNAME instead)
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=arr
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      # don't let tailscale rewrite the host's resolv.conf — MagicDNS
      # resolution happens on the *client* side, so the server doesn't need it
      - TS_ACCEPT_DNS=false
      - TZ=${TZ}
    volumes:
      - /data/config/tailscale:/var/lib/tailscale
    restart: unless-stopped
